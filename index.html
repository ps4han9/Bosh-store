<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bo'sh store - PS4 Jailbreak</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bosh-gold: #e1b33b; /* نفس درجة الذهبي اللي في اللوجو */
    --bosh-light: #fbe58f;
    --dark-bg: rgba(10, 10, 10, 0.95);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #000000;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    display: flex; align-items: center; justify-content: center;
    direction: rtl; overflow: hidden;
  }

  /* إضاءة ذهبية خفيفة من المنتصف */
  body::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(225, 179, 59, 0.1) 0%, rgba(0,0,0,1) 100%);
    z-index: 0;
  }

  /* الحاوية الأساسية */
  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 850px;
    background: var(--dark-bg);
    border: 1px solid #222;
    border-radius: 12px;
    padding: 50px 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(225, 179, 59, 0.05);
  }

  /* الخط الذهبي اللي تحت الاسم في اللوجو */
  .hud-container::before {
    content: ''; position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    width: 250px; height: 3px; background: var(--bosh-gold);
    box-shadow: 0 2px 10px var(--bosh-gold);
  }

  .brand-title {
    font-family: 'Georgia', 'Times New Roman', serif; font-size: 4.5rem;
    text-align: center; color: var(--bosh-gold); letter-spacing: 2px; margin-bottom: 35px;
    direction: ltr; text-shadow: 0 0 15px rgba(225, 179, 59, 0.4);
  }
  
  .brand-sub {
    font-size: 1.2rem; text-align: center; color: #aaa;
    font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 25px; direction: ltr;
  }

  /* شاشة الفحص */
  .status-panel {
    background: rgba(0, 0, 0, 0.8); padding: 25px; border-radius: 8px;
    border: 1px solid rgba(225, 179, 59, 0.3); margin-bottom: 25px;
    position: relative; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
  }

  .status-panel::before {
    content: 'SYSTEM CHECK'; position: absolute; top: -12px; right: 20px;
    background: var(--bosh-gold); color: #000; padding: 2px 10px;
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 3px;
  }

  #state { font-size: 26px; font-weight: 900; color: var(--bosh-light); text-align: center; margin-bottom: 12px; text-shadow: 0 0 10px rgba(225, 179, 59, 0.4); }
  #det { font-size: 18px; color: #aebfd3; text-align: center; line-height: 1.8; }
  #det b { color: #000; background: var(--bosh-gold); padding: 2px 8px; border-radius: 4px; }
  #cache { font-size: 14px; color: #8192a8; text-align: center; margin-top: 15px; font-weight: bold; }
  #cache.cacheok { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
  
  .ok { color: #00ff88; } .bad { color: #ff3333; } .warn { color: var(--bosh-gold); }

  /* كروت التواصل */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .contact-card {
    background: linear-gradient(180deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.9) 100%);
    padding: 15px; border-radius: 8px;
    border: 1px solid #222; border-right: 3px solid var(--bosh-gold);
    transition: 0.3s; display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .contact-card.full { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; text-align: right; }
  .contact-card:hover { border-color: var(--bosh-gold); box-shadow: 0 5px 20px rgba(225, 179, 59, 0.15); transform: translateY(-2px); }
  
  .c-title { color: #888; font-size: 14px; font-weight: 800; margin-bottom: 5px; display: block; }
  .full .c-title { margin-bottom: 0; margin-left: 15px; font-size: 16px; color: var(--bosh-gold); }
  .c-val { color: #fff; font-size: 22px; font-weight: 900; direction: ltr; }
  .full .c-val { font-size: 16px; direction: rtl; line-height: 1.5; flex: 1; }

  /* حقوق الملكية */
  .powered-by { position: fixed; bottom: 12px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--bosh-gold); font-weight: 900; text-shadow: 0 0 8px var(--bosh-gold); }
  .footer-sys { position: fixed; bottom: 12px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; z-index: 10; direction: ltr; }

  @media (max-width: 600px) {
    .brand-title { font-size: 3.5rem; margin-bottom: 25px;}
    .hud-container::before { top: 90px; width: 180px;}
    .hud-container { padding: 30px 15px; }
    .contact-grid { grid-template-columns: 1fr; }
    .contact-card.full { flex-direction: column; text-align: center; }
    .full .c-title { margin-left: 0; margin-bottom: 5px; } .full .c-val { text-align: center; }
    .powered-by { font-size: 10px; right: 10px; } .footer-sys { font-size: 9px; left: 10px; }
  }
</style>
</head>
<body>

<div class="hud-container">
  
  <h1 class="brand-title">Bo'sh store</h1>
  <div class="brand-sub">PS4 Jailbreak 11.00 - 12.00 - 13.00</div>
  
  <div class="status-panel">
    <div id="state">جارٍ فحص النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

  <div class="contact-grid">
    <div class="contact-card full">
      <span class="c-title">📍 العنوان</span>
      <span class="c-val">المنوفية - الباجور</span>
    </div>
    <div class="contact-card">
      <span class="c-title">📱 موبايل (1)</span>
      <span class="c-val">01023229056</span>
    </div>
    <div class="contact-card">
      <span class="c-title">📱 موبايل (2)</span>
      <span class="c-val">01067099328</span>
    </div>
  </div>

</div>

<!-- البصمة في الزاوية اليمين -->
<div class="powered-by">POWERED BY <span>MAHMOUD FATHY</span></div>
<!-- إصدار السيستم في الزاوية الشمال -->
<div class="footer-sys">BO'SH OS v1.0</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { stateEl.innerHTML = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = "> " + t; cacheEl.className = ok ? "cacheok" : ""; }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "تم التحديد يدوياً ?bug=" + forced;
    } else if (!key) {
        why = "تحذير: هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = "النظام مدعوم: توجيه مسار (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = "النظام مدعوم: توجيه مسار (Poops)";
    } else {
        why = "تحذير: هذا الإصدار غير مدعوم حالياً";
    }

    var fwDisplay = key ? "<b>V_" + key + "</b>" : "<span style='color:#8f9eb0;'>UNKNOWN</span>";
    var bugDisplay = bug ? "<b style='color:var(--bosh-gold);'>" + bug.toUpperCase() + "_CHAIN</b>" : "<span style='color:#8f9eb0;'>N/A</span>";

    detEl.innerHTML = "OS_VERSION: " + fwDisplay + " | EXPLOIT: " + bugDisplay + "<br><br><span style='color: #fff; font-size:16px;'>" + why + "</span>";

    if (!bug) { setState("إصدار غير مدعوم ACCESS DENIED", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

    function go() {
        setState("جارٍ تهيئة الثغرة INITIATING...", "warn");
        setTimeout(function() { location.replace(target); }, 500);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) { go(); }
    else if (!navigator.onLine) { setCache("وضع الأوفلاين نشط", true); go(); }
    else if (ac.status === ac.IDLE) { setCache("ملفات الكاش جاهزة للاستخدام", true); go(); }
    else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث بنجاح", true);
        waitForTap("تحديث جاهز — اضغط للتنفيذ", function () { location.reload(); });
    } else {
        setCache("جارٍ فحص التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("يتم سحب الملفات للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) { if (e && e.total) { setCache("جاري التخزين: " + Math.round((e.loaded / e.total) * 100) + "%"); } }, false);
        ac.addEventListener("cached", function () { setCache("اكتمل التخزين — يمكنك الاستخدام بدون نت", true); waitForTap("النظام جاهز — اضغط للتشغيل", go); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} setCache("التحديث جاهز", true); waitForTap("تحديث متوفر — اضغط لإعادة التحميل", function () { location.reload(); }); }, false);
        ac.addEventListener("noupdate", function () { setCache("التخزين المؤقت محدث وجاهز", true); go(); }, false);
        ac.addEventListener("error", function () { setCache("حدث خطأ في سحب الكاش"); waitForTap("فشل التخزين — اضغط للتشغيل الإجباري", go); }, false);
        ac.addEventListener("obsolete", function () { setCache("ملفات الكاش قديمة"); waitForTap("تنبيه ملفات قديمة — اضغط للتشغيل", go); }, false);
    }
})();
</script>
</body>
</html>
